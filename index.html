<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive generation-wise gene counts by reactor region.">
  <title>Gene evolution by generation</title>
  <style>
    @font-face {
      font-family: "Source Sans 3 Local";
      src: url("SourceSans3-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --ink: #243973;
      --surface: #ffffff;
      --page: #f4f6fb;
      --border: #ccd4e7;
      --focus: #4666b0;
      --main-size: 1.35rem;
      --small-size: 1.2rem;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font-family: "Source Sans 3 Local", "Source Sans 3", Arial, sans-serif;
      font-size: var(--main-size);
    }

    main {
      width: min(1500px, calc(100% - 32px));
      margin: 24px auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 18px;
      margin-bottom: 16px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    label {
      display: grid;
      gap: 7px;
      min-width: 190px;
      font-size: var(--main-size);
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 8px 42px 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
      outline-offset: 2px;
    }

    .chart-shell {
      overflow: hidden;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(7, 16, 81, 0.08);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto;
      background: #fff;
    }

    .main-text { font-size: 26px; fill: var(--ink); }
    .small-text { font-size: 24px; fill: var(--ink); }
    .axis { stroke: var(--ink); stroke-width: 1.6; }
    .tick { stroke: var(--ink); stroke-width: 1.2; }

    .status {
      min-height: 1.4em;
      margin: 12px 4px 0;
      font-size: var(--small-size);
    }

    @media (max-width: 700px) {
      main { width: min(100% - 16px, 1500px); margin: 8px auto; }
      .controls { gap: 14px; padding: 14px; }
      label { flex: 1 1 100%; min-width: 0; }
      select { min-height: 52px; }
      .chart-shell { padding: 4px; }
      .status { margin-inline: 2px; }
    }
  </style>
</head>

          <option value="2">Region 2</option>
          <option value="3">Region 3</option>
          <option value="4">Region 4</option>

      <label for="gene-select">

          <option value="fuel_type">Fuel type</option>
          <option value="enrichment">Enrichment</option>
          <option value="ratio">Uranium ratio</option>

      </label>

        <desc id="chart-description">Cumulative stacked candidate counts by generation.</desc>
      </svg>
    </section>
    <p class="status" id="status" aria-live="polite"></p>

      const DATA = selectedDataset.data;
      const region = Number(regionSelect.value);
      const gene = geneSelect.value;
      const regionKey = `region_${region}`;
      const entries = Object.entries(DATA.series[regionKey][gene]);
      const generations = DATA.generations;
      const total = DATA.expectedCandidates;
      const isMobile = mobileQuery.matches;

      chart.replaceChildren();

      const width = isMobile ? 620 : 1200;
      const height = isMobile ? 920 : 700;
      const margin = isMobile
        ? { top: 82, right: 35, bottom: 330, left: 90 }
        : { top: 82, right: 250, bottom: 92, left: 105 };
      chart.setAttribute("viewBox", `0 0 ${width} ${height}`);
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const xMin = Math.min(...generations);
      const xMax = Math.max(...generations);
      const x = value => margin.left + ((value - xMin) / (xMax - xMin)) * plotWidth;
      const y = value => margin.top + plotHeight - (value / total) * plotHeight;

      const title = `${GENE_TITLES[gene]} in region ${region}`;
      chart.appendChild(svgElement("title", { id: "chart-title" }, title));
      chart.appendChild(svgElement("desc", { id: "chart-description" },
        `${selectedDataset.label}. Cumulative stacked ${GENE_TITLES[gene].toLowerCase()} candidate counts by generation.`));
      addText(chart, margin.left + plotWidth / 2, 45, title, "main-text", "middle");

      let lower = Array(generations.length).fill(0);
      entries.forEach(([label, values], index) => {
        const upper = values.map((value, i) => lower[i] + value);
        const upperPoints = generations.map((generation, i) => `${x(generation)},${y(upper[i])}`);
        const lowerPoints = [...generations].reverse().map((generation, reverseIndex) => {
          const i = generations.length - 1 - reverseIndex;
          return `${x(generation)},${y(lower[i])}`;
        });
        const points = [...upperPoints, ...lowerPoints].join(" ");
        chart.appendChild(svgElement("polygon", {
          points,
          fill: COLORS[index],
          stroke: "none"
        }));
        lower = upper;
      });

      chart.appendChild(svgElement("line", {
        x1: margin.left,
        y1: y(0),
        x2: margin.left + plotWidth,
        y2: y(0),
        class: "axis"
      }));
      chart.appendChild(svgElement("line", {
        x1: margin.left,
        y1: margin.top,
        x2: margin.left,
        y2: y(0),
        class: "axis"
      }));

      for (let generation = xMin; generation <= xMax; generation += 10) {
        const tickX = x(generation);
        chart.appendChild(svgElement("line", {
          x1: tickX, y1: y(0), x2: tickX, y2: y(0) + 8, class: "tick"
        }));
        addText(chart, tickX, y(0) + 38, String(generation), "small-text", "middle");
      }

      for (let count = 0; count <= total; count += 5) {
        const tickY = y(count);
        chart.appendChild(svgElement("line", {
          x1: margin.left - 8, y1: tickY, x2: margin.left, y2: tickY, class: "tick"
        }));
        addText(chart, margin.left - 18, tickY + 8, String(count), "small-text", "end");
      }

      addText(
        chart,
        margin.left + plotWidth / 2,
        y(0) + 78,
        "Generation",
        "main-text",
        "middle"
      );
      addText(
        chart,
        isMobile ? 28 : 33,
        margin.top + plotHeight / 2,
        "Number of candidates",
        "main-text",
        "middle",
        {
          transform: `rotate(-90 ${isMobile ? 28 : 33} ${margin.top + plotHeight / 2})`
        }
      );

      const legendX = isMobile ? margin.left : margin.left + plotWidth + 50;
      const legendTitleY = isMobile ? y(0) + 135 : margin.top + 10;
      addText(chart, legendX, legendTitleY, LEGEND_TITLES[gene], "main-text");
      entries.forEach(([label], index) => {
        const column = isMobile ? index % 2 : 0;
        const row = isMobile ? Math.floor(index / 2) : index;
        const itemX = legendX + column * 255;
        const itemY = legendTitleY + 54 + row * 64;
        chart.appendChild(svgElement("rect", {
          x: itemX,
          y: itemY - 24,
          width: isMobile ? 48 : 58,
          height: 34,
          rx: 3,
          fill: COLORS[index]
        }));
        addText(chart, itemX + (isMobile ? 62 : 76), itemY + 3, label, "small-text");
      });

      status.textContent = `${selectedDataset.label} · ${title} · ${generations.length} generations · ${total} candidates per generation`;
    }

    datasetSelect.addEventListener("change", renderChart);
    regionSelect.addEventListener("change", renderChart);
    geneSelect.addEventListener("change", renderChart);
    let resizeFrame = null;
    window.addEventListener("resize", () => {
      if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = null;
        renderChart();
      });
    });
    renderChart();
  </script>
</body>
</html>
